<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="1200" height="140" preserveAspectRatio="none" role="img" aria-label="">
  <style>
    .glow { animation: drift var(--d) ease-in-out infinite alternate, breathe var(--b) ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(var(--from)); } to { transform: translateX(var(--to)); } }
    @keyframes breathe { from { opacity: 0.25; } to { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; opacity: 0.6; } }
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- Fade the top edge out so no hard line meets the page background. -->
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="edge">
      <rect width="1200" height="140" fill="url(#fade)"/>
    </mask>
  </defs>
  <g mask="url(#edge)">
    <g filter="url(#blur)">
      <ellipse class="glow" cx="200" cy="130" rx="320" ry="80" fill="#003D00" style="--d:19s;--b:7s;--from:-120px;--to:260px"/>
      <ellipse class="glow" cx="600" cy="125" rx="300" ry="75" fill="#007A00" style="--d:23s;--b:9s;--from:220px;--to:-240px"/>
      <ellipse class="glow" cx="950" cy="135" rx="280" ry="70" fill="#00C04B" style="--d:17s;--b:6s;--from:-200px;--to:150px"/>
      <ellipse class="glow" cx="420" cy="140" rx="260" ry="60" fill="#00C04B" style="--d:27s;--b:11s;--from:300px;--to:-100px"/>
      <ellipse class="glow" cx="1100" cy="128" rx="240" ry="65" fill="#003D00" style="--d:21s;--b:8s;--from:-260px;--to:80px"/>
    </g>
  </g>
</svg>