<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" width="1200" height="180" preserveAspectRatio="none" role="img" aria-label="">
  <style>
    .glow { animation: drift var(--d) ease-in-out infinite alternate, breathe var(--b) ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(var(--from)); } to { transform: translateX(var(--to)); } }
    @keyframes breathe { from { opacity: 0.25; } to { opacity: 0.85; } }
    @media (prefers-reduced-motion: reduce) { .glow { animation: none; opacity: 0.6; } }
  </style>
  <defs>
    <filter id="blur" x="-50%" y="-100%" width="200%" height="300%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <!-- Every edge fades to transparent, so the image never ends on a visible line. -->
    <linearGradient id="fadeY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeX" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edgeY" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="180">
      <rect width="1200" height="180" fill="url(#fadeY)"/>
    </mask>
    <mask id="edgeX" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="180">
      <rect width="1200" height="180" fill="url(#fadeX)"/>
    </mask>
  </defs>
  <g mask="url(#edgeX)">
    <g mask="url(#edgeY)">
      <g filter="url(#blur)">
        <ellipse class="glow" cx="200" cy="92" rx="320" ry="55" fill="#003D00" style="--d:19s;--b:7s;--from:-120px;--to:260px"/>
        <ellipse class="glow" cx="600" cy="88" rx="300" ry="50" fill="#007A00" style="--d:23s;--b:9s;--from:220px;--to:-240px"/>
        <ellipse class="glow" cx="950" cy="95" rx="280" ry="48" fill="#00C04B" style="--d:17s;--b:6s;--from:-200px;--to:150px"/>
        <ellipse class="glow" cx="420" cy="98" rx="260" ry="42" fill="#00C04B" style="--d:27s;--b:11s;--from:300px;--to:-100px"/>
        <ellipse class="glow" cx="1100" cy="90" rx="240" ry="45" fill="#003D00" style="--d:21s;--b:8s;--from:-260px;--to:80px"/>
      </g>
    </g>
  </g>
</svg>